name: stale

# The rule from CONTRIBUTING.md, run by a bot rather than from memory: a pull
# request labelled waiting-for-author with no reply for a week is closed. It only
# looks at PRs a person has labelled, so nothing unanswered is ever closed; the
# blocked label exempts PRs that are waiting on someone else.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # Issues are never touched: the rule is about pull requests.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 5
          days-before-pr-close: 2
          only-pr-labels: waiting-for-author
          exempt-pr-labels: blocked
          stale-pr-label: stale
          remove-pr-stale-when-updated: true
          stale-pr-message: >
            Five days without a reply to the requested changes. Following
            CONTRIBUTING.md, this pull request will close in two days unless
            something happens; any comment or commit cancels that. It is not a
            rejection, and it can be reopened with the same code at any time.
          close-pr-message: >
            A week without a reply, so closing as described in CONTRIBUTING.md.
            Nothing is lost: reopen or resubmit the same code at any time and
            the conversation continues from here.
