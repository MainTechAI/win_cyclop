name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/pyproject.toml
      - name: Install
        run: |
          python -m pip install -e ".[dev,speech]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          CYCLOP_HANG_LOG: hang.log
        run: |
          python -m pytest -v -p no:faulthandler 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the end of the output as check annotations (readable without log access).
            if (Test-Path hang.log) {
              $picked = Get-Content hang.log | Where-Object { $_ -match '^(\[FAILED\]|E  )' } | Select-Object -First 9
              foreach ($line in $picked) {
                $clean = ($line -replace '[^\x20-\x7E]', '?')
                if ($clean.Length -gt 300) { $clean = $clean.Substring(0, 300) }
                Write-Output ("::warning title=test detail::" + $clean.Replace('%', '%25'))
              }
            }
          }
          exit $code
      - name: Verify native Windows media bindings
        run: python scripts/check-winrt.py
      - name: Test desktop interactions, window stacking and OCR
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: windows
          CYCLOP_HANG_LOG: hang-native.log
        run: |
          python -m pytest tests/test_interactions.py "tests/test_features.py::test_windows_ocr_reads_rendered_text" -v -p no:faulthandler
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path hang-native.log)) {
            $picked = Get-Content hang-native.log | Where-Object { $_ -match '^(\[FAILED\]|E  )' } | Select-Object -First 9
            foreach ($line in $picked) {
              $clean = ($line -replace '[^\x20-\x7E]', '?')
              if ($clean.Length -gt 300) { $clean = $clean.Substring(0, 300) }
              Write-Output ("::warning title=test detail::" + $clean.Replace('%', '%25'))
            }
          }
          exit $code
      - name: Build portable application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name CyclopWindows --icon cyclop_windows/assets/cyclop.ico --collect-submodules winrt --collect-data faster_whisper --collect-binaries ctranslate2 --copy-metadata cyclop-windows scripts/launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ..\LICENSE dist\CyclopWindows\LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\CyclopWindows\THIRD_PARTY_NOTICES.md
          Copy-Item README.md dist\CyclopWindows\README.md
          python scripts/collect-licenses.py dist/CyclopWindows/licenses
          python -m pip freeze | Out-File dist\CyclopWindows\BUILD-DEPENDENCIES.txt -Encoding utf8
      - name: Smoke test packaged application
        run: |
          $env:CYCLOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cyclop-smoke'
          $process = Start-Process -FilePath dist\CyclopWindows\CyclopWindows.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id
            throw "Packaged startup test timed out."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged startup test failed: $($process.ExitCode)" }
          $report = Get-Content (Join-Path $env:CYCLOP_DATA_DIR 'startup-check.json') | ConvertFrom-Json
          if (-not $report.success) { throw "Packaged startup check did not succeed." }
          Write-Output "Packaged UI rendered and exited cleanly."
          Copy-Item (Join-Path $env:CYCLOP_DATA_DIR 'startup-check.json') dist\CyclopWindows\STARTUP-CHECK.json
      - name: Package
        run: Compress-Archive -Path dist\CyclopWindows -DestinationPath dist\CyclopWindows-win-x64.zip
      - name: Build standalone executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CyclopWindows --distpath dist/standalone --icon cyclop_windows/assets/cyclop.ico --collect-submodules winrt --collect-data faster_whisper --collect-binaries ctranslate2 --copy-metadata cyclop-windows --add-data "dist/CyclopWindows/licenses:licenses" --add-data "../LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." scripts/launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test standalone executable
        run: |
          $env:CYCLOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cyclop-standalone-smoke'
          $process = Start-Process -FilePath dist\standalone\CyclopWindows.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw "Standalone startup test timed out."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Standalone startup test failed: $($process.ExitCode)" }
          $report = Get-Content (Join-Path $env:CYCLOP_DATA_DIR 'startup-check.json') | ConvertFrom-Json
          if (-not $report.success) { throw "Standalone startup check did not succeed." }
      - uses: actions/upload-artifact@v4
        with:
          name: CyclopWindows-win-x64
          path: |
            windows/dist/CyclopWindows-win-x64.zip
            windows/dist/standalone/CyclopWindows.exe
          if-no-files-found: error
          retention-days: 30
