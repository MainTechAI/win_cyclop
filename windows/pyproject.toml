[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclop-windows"
version = "0.1.0"
description = "Cyclop's notch toolbox, reimplemented for Windows 11"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "icalendar>=6.1,<8",
  "recurring-ical-events>=3.4,<4",
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]
translate = ["argostranslate>=1.9,<2"]

[project.gui-scripts]
cyclop-windows = "cyclop_windows.app:main"

[tool.setuptools.packages.find]
include = ["cyclop_windows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
